# SPDX-License-Identifier: MIT
# Nightly Jobs - Dependency Updates & Extended Testing
# =====================================================

name: Nightly Maintenance

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

env:
  QT_VERSION: '6.6.2'

jobs:
  # ==========================================================================
  # Dependency Update Checks
  # ==========================================================================
  dependency-updates:
    name: Dependency Update Scan
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Check Qt Updates
        id: qt-check
        run: |
          echo "::group::Qt Version Check"

          # Check Qt 6.x releases from official API
          LATEST_QT=$(curl -s "https://api.github.com/repos/qt/qtbase/tags" | \
                     jq -r '.[].name' | grep '^v6\.' | head -1 | sed 's/^v//')

          CURRENT_QT="${{ env.QT_VERSION }}"

          echo "Current Qt version: $CURRENT_QT"
          echo "Latest Qt version: $LATEST_QT"

          if [ "$LATEST_QT" != "$CURRENT_QT" ]; then
            echo "qt_update_available=true" >> $GITHUB_OUTPUT
            echo "latest_qt_version=$LATEST_QT" >> $GITHUB_OUTPUT
            echo "::notice::Qt update available: $CURRENT_QT → $LATEST_QT"
          else
            echo "qt_update_available=false" >> $GITHUB_OUTPUT
            echo "::notice::Qt is up to date: $CURRENT_QT"
          fi
          echo "::endgroup::"

      - name: Check Security Updates
        run: |
          echo "::group::Security Update Check"

          # Check for security updates in Ubuntu packages
          sudo apt-get update
          SECURITY_UPDATES=$(apt list --upgradable 2>/dev/null | grep -c security || echo 0)

          echo "Available security updates: $SECURITY_UPDATES"

          if [ "$SECURITY_UPDATES" -gt 0 ]; then
            echo "::warning::$SECURITY_UPDATES security updates available"
          else
            echo "::notice::No security updates available"
          fi
          echo "::endgroup::"

      - name: Check CMake Updates
        run: |
          echo "::group::CMake Version Check"

          CURRENT_CMAKE=$(cmake --version | head -1 | awk '{print $3}')
          LATEST_CMAKE=$(curl -s "https://api.github.com/repos/Kitware/CMake/releases/latest" | \
                        jq -r '.tag_name' | sed 's/^v//')

          echo "Current CMake: $CURRENT_CMAKE"
          echo "Latest CMake: $LATEST_CMAKE"

          if [ "$LATEST_CMAKE" != "$CURRENT_CMAKE" ]; then
            echo "::notice::CMake update available: $CURRENT_CMAKE → $LATEST_CMAKE"
          fi
          echo "::endgroup::"

      - name: Create Update Issue
        if: steps.qt-check.outputs.qt_update_available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Dependency Update Available: Qt ${{ steps.qt-check.outputs.latest_qt_version }}`;
            const body = `
            ## Dependency Update Available

            **Qt Framework Update**
            - Current version: \`${{ env.QT_VERSION }}\`
            - Latest version: \`${{ steps.qt-check.outputs.latest_qt_version }}\`

            ### Action Required
            1. Update QT_VERSION in \`.github/workflows/ci.yml\`
            2. Test build compatibility
            3. Update documentation if needed
            4. Run full test suite

            ### Checklist
            - [ ] Update QT_VERSION environment variable
            - [ ] Test Linux build
            - [ ] Test macOS build
            - [ ] Test Windows build
            - [ ] Verify all tests pass
            - [ ] Update CHANGELOG.md

            **Auto-generated by nightly dependency check**
            `;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies'
            });

            const existingIssue = issues.find(issue => issue.title.includes('Qt'));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependencies', 'enhancement']
              });
            }

  # ==========================================================================
  # Beta/Nightly Compiler Testing
  # ==========================================================================
  beta-compiler-test:
    name: Beta Compiler Testing
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true  # Don't fail nightly if beta fails

    strategy:
      matrix:
        compiler:
          - name: GCC Latest
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
          - name: Clang Latest
            cc: clang-17
            cxx: clang++-17
            packages: clang-17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Beta Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common

          # Add latest compiler PPAs
          if [[ "${{ matrix.compiler.packages }}" == *"gcc"* ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          elif [[ "${{ matrix.compiler.packages }}" == *"clang"* ]]; then
            wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
            sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main"
          fi

          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler.packages }} || {
            echo "::warning::Failed to install ${{ matrix.compiler.name }}, skipping"
            exit 0
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtsvg'
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev

      - name: Test Build with Beta Compiler
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          echo "::group::${{ matrix.compiler.name }} Compatibility Test"

          # Configure with beta compiler
          cmake -B build-beta \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-Werror" || {
            echo "::warning::${{ matrix.compiler.name }} configuration failed"
            exit 0
          }

          # Build
          cmake --build build-beta --parallel $(nproc) || {
            echo "::warning::${{ matrix.compiler.name }} build failed"
            exit 0
          }

          # Test
          export QT_QPA_PLATFORM=offscreen
          cd build-beta
          ctest --output-on-failure --parallel $(nproc) --timeout 300 || {
            echo "::warning::${{ matrix.compiler.name }} tests failed"
            exit 0
          }

          echo "✅ ${{ matrix.compiler.name }} compatibility confirmed"
          echo "::endgroup::"

      - name: Report Beta Results
        run: |
          echo "::notice::Beta compiler testing completed for ${{ matrix.compiler.name }}"

  # ==========================================================================
  # Extended Test Runs
  # ==========================================================================
  extended-tests:
    name: Extended Test Suite
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtsvg'
          cache: true

      - name: Configure Extended Build
        run: |
          cmake -B build-extended \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-g -O0 -fprofile-arcs -ftest-coverage"

      - name: Build
        run: |
          cmake --build build-extended --parallel $(nproc)

      - name: Extended Test Run (1000 iterations)
        run: |
          echo "::group::Extended Test Iterations"
          export QT_QPA_PLATFORM=offscreen
          cd build-extended

          # Run each test 1000 times to catch flaky tests
          for test in $(find . -name "tst_*" -executable); do
            echo "Running extended test for $(basename $test)..."
            for i in {1..1000}; do
              ./"$test" > /dev/null 2>&1 || {
                echo "::error::Test $(basename $test) failed on iteration $i"
                exit 1
              }

              # Progress indicator every 100 iterations
              if [ $((i % 100)) -eq 0 ]; then
                echo "  Progress: $i/1000"
              fi
            done
            echo "✅ $(basename $test): 1000/1000 passed"
          done
          echo "::endgroup::"

      - name: Memory Stress Test
        run: |
          echo "::group::Memory Stress Test"
          sudo apt-get install -y valgrind
          export QT_QPA_PLATFORM=offscreen
          cd build-extended

          # Run tests under memory stress
          for test in $(find . -name "tst_*" -executable); do
            echo "Memory stress testing $(basename $test)..."
            valgrind --tool=memcheck --leak-check=full --error-exitcode=1 \
                    --track-origins=yes ./"$test" || {
              echo "::error::Memory issues detected in $(basename $test)"
              exit 1
            }
          done
          echo "✅ Memory stress test completed"
          echo "::endgroup::"

      - name: Thread Safety Stress Test
        run: |
          echo "::group::Thread Safety Stress Test"
          # Simulate high concurrency scenarios
          export QT_QPA_PLATFORM=offscreen
          cd build-extended

          # Run tests with thread sanitizer if available
          if command -v clang++-15 >/dev/null; then
            echo "Rebuilding with thread sanitizer..."
            cd ..
            cmake -B build-tsan \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_COMPILER=clang++-15 \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -g"

            cmake --build build-tsan --parallel $(nproc)

            cd build-tsan
            for test in $(find . -name "tst_*" -executable); do
              echo "Thread safety testing $(basename $test)..."
              ./"$test" || {
                echo "::error::Thread safety issue in $(basename $test)"
                exit 1
              }
            done
          fi
          echo "✅ Thread safety stress test completed"
          echo "::endgroup::"

  # ==========================================================================
  # Security Deep Scan
  # ==========================================================================
  security-deep-scan:
    name: Deep Security Analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Security Tools
        run: |
          pip install --user bandit semgrep safety
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tools-15

      - name: Deep Semgrep Analysis
        run: |
          echo "::group::Deep Security Scan"
          # Run all security rule sets
          semgrep --config=p/security-audit \
                 --config=p/secrets \
                 --config=p/cwe-top-25 \
                 --config=p/owasp-top-10 \
                 --config=p/dockerfile \
                 --config=p/kubernetes \
                 --error --timeout=600 \
                 --json --output=security-report.json \
                 . || {
            echo "::error::Deep security scan found issues"
            cat security-report.json
            exit 1
          }
          echo "::endgroup::"

      - name: Supply Chain Security
        run: |
          echo "::group::Supply Chain Analysis"

          # Check for suspicious dependencies
          if [ -f "CMakeLists.txt" ]; then
            echo "Analyzing CMake dependencies..."
            grep -i "find_package\|fetch_content" CMakeLists.txt | \
              while read -r line; do
                echo "Dependency: $line"
              done
          fi

          # Check for Git submodules
          if [ -f ".gitmodules" ]; then
            echo "::warning::Git submodules detected - review supply chain"
            cat .gitmodules
          fi

          echo "::endgroup::"

      - name: Code Quality Deep Analysis
        run: |
          echo "::group::Deep Code Quality Analysis"
          # Advanced cppcheck analysis
          cppcheck --enable=all \
                  --inconclusive \
                  --force \
                  --error-exitcode=1 \
                  --xml --xml-version=2 \
                  --output-file=cppcheck-report.xml \
                  src/ || {
            echo "::error::Deep code quality issues found"
            cat cppcheck-report.xml
            exit 1
          }
          echo "::endgroup::"

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            security-report.json
            cppcheck-report.xml
          retention-days: 30
        if: always()

  # ==========================================================================
  # Performance Baseline
  # ==========================================================================
  performance-baseline:
    name: Performance Baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev time

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtsvg'
          cache: true

      - name: Configure Release Build
        run: |
          cmake -B build-perf \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build with Timing
        run: |
          echo "::group::Build Performance"
          /usr/bin/time -f "Build time: %E" \
            cmake --build build-perf --parallel $(nproc)
          echo "::endgroup::"

      - name: Test Performance Baseline
        run: |
          echo "::group::Test Performance"
          export QT_QPA_PLATFORM=offscreen
          cd build-perf

          # Time each test run
          for test in $(find . -name "tst_*" -executable); do
            echo "Timing $(basename $test)..."
            /usr/bin/time -f "$(basename $test): %E" ./"$test"
          done
          echo "::endgroup::"

      - name: Memory Usage Baseline
        run: |
          echo "::group::Memory Usage Baseline"
          export QT_QPA_PLATFORM=offscreen
          cd build-perf

          # Memory usage for each test
          for test in $(find . -name "tst_*" -executable); do
            echo "Memory usage for $(basename $test):"
            /usr/bin/time -f "Peak memory: %M KB" ./"$test"
          done
          echo "::endgroup::"

  # ==========================================================================
  # Summary Report
  # ==========================================================================
  nightly-summary:
    name: Nightly Summary Report
    runs-on: ubuntu-22.04
    needs: [dependency-updates, beta-compiler-test, extended-tests, security-deep-scan, performance-baseline]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# Nightly Maintenance Report - $(date)" > summary.md
          echo "" >> summary.md

          echo "## Results" >> summary.md
          echo "- ✅ Dependency updates: ${{ needs.dependency-updates.result }}" >> summary.md
          echo "- ✅ Beta compiler testing: ${{ needs.beta-compiler-test.result }}" >> summary.md
          echo "- ✅ Extended tests: ${{ needs.extended-tests.result }}" >> summary.md
          echo "- ✅ Security deep scan: ${{ needs.security-deep-scan.result }}" >> summary.md
          echo "- ✅ Performance baseline: ${{ needs.performance-baseline.result }}" >> summary.md
          echo "" >> summary.md

          echo "## Next Actions" >> summary.md
          echo "- Review any dependency update issues created" >> summary.md
          echo "- Address any security findings" >> summary.md
          echo "- Monitor performance trends" >> summary.md

          cat summary.md

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: nightly-summary
          path: summary.md
          retention-days: 7