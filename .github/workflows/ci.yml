name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      COVERAGE_THRESHOLD: "100"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0"

      - name: Cache SwiftPM (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Show Swift Version
        run: swift --version

      - name: Init Environment
        run: make init

      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell Lint
        run: make shell-lint

      - name: Security Audit
        run: make security

      - name: Build
        run: make build

      - name: Test and Coverage
        run: make test

      - name: Hygiene Gate
        run: make hygiene

      - name: Verify Signed Commits
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            RANGE="HEAD~20..HEAD"
          fi
          ./scripts/security/verify-signed-commits.sh "$RANGE"

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-artifacts-${{ matrix.os }}
          path: |
            governance/sbom/cyclonedx-sbom.json
            governance/sbom/validation-record.json
          if-no-files-found: error

  wsl2-self-hosted:
    name: WSL2 Build and Test (Optional)
    if: github.event_name == 'pull_request' && vars.ENABLE_WSL2_RUNNER == 'true'
    runs-on:
      - self-hosted
      - windows
      - x64
      - wsl2
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build and Test in WSL2
        shell: bash
        run: |
          make init
          make security
          make build
          make test
          make hygiene
